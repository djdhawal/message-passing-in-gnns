[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn_mech"
version = "0.1.0"
description = "Mechanistic analysis of over-squashing and attention dilution in hybrid GNNs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch_geometric",
    "numpy",
    "scipy",
    "networkx",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gnn_mech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
