# Tuned GCN baseline on Peptides-func (Tönshoff et al. style: residuals, BN,
# mean pooling). Reference point for the hybrid alpha sweep.
exp_name: peptides_func_gcn
out_dir: ./runs
data:
  name: Peptides-func
  pe_dim: 20
model:
  arch: gcn
  hidden: 240
  layers: 6
  dropout: 0.1
train:
  epochs: 250
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_epochs: 5
  grad_clip: 1.0
