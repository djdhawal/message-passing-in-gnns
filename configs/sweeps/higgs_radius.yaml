# Higgs check: attention-radius sweep: MPNN + softmax attention masked to k hops,
# k=0 means no attention (alpha=0), k=inf means the whole subgraph. alpha fixed at 0.5, branch norms affine-free.
# 2 targets x 3 split seeds x variants x 2 model seeds; baselines mlp and gcn in the same exp_name.
#   python -m gnn_mech.sweep configs/sweeps/higgs_radius.yaml [--dry-run] out_dir=<drive>/runs
# Optional: append data.halo_hops=1 to every run (context-only halo nodes); check subgraph sizes first.
measure_minutes: 0.5
runs:
- name: active_after/split0/radius0
  config: configs/social/higgs_check.yaml
  overrides:
  - exp_name=higgs_radius
  - data.target=active_after
  - data.split_seed=0
  - model.alpha=0.0
  seeds: &id001
  - 0
  - 1
  est_minutes: 0.5
- name: active_after/split0/radius1
  config: configs/social/higgs_check.yaml
  overrides:
  - exp_name=higgs_radius
  - data.target=active_after
  - data.split_seed=0
  - model.alpha=0.5
  - model.attn=radius
  - model.attn_radius=1
  seeds: *id001
  est_minutes: 0.5
- name: active_after/split0/radius2
