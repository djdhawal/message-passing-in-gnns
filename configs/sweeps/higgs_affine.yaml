# Higgs check: alpha sweep with affine-free branch norms (alpha is a real fixed weight).
# 2 targets x 3 split seeds x variants x 2 model seeds; baselines mlp and gcn in the same exp_name.
#   python -m gnn_mech.sweep configs/sweeps/higgs_affine.yaml [--dry-run] out_dir=<drive>/runs
# Optional: append data.halo_hops=1 to every run (context-only halo nodes); check subgraph sizes first.
measure_minutes: 0.5
runs:
