# Higgs checks (follow layer): base config for configs/sweeps/higgs_affine.yaml and higgs_radius.yaml.
# Changes from configs/social/higgs_follow.yaml:
#   - subgraph_size 500 (about 70 METIS parts, ~10 test subgraphs instead of 3); split_seed is swept.
#   - local: gcn (degree-normalised; GINE's sum aggregation was unstable on hubs, alpha=0 had ±0.034).
#   - attn: softmax (exact dense attention is cheap on 500-node subgraphs; Performer not needed).
#   - branch_affine: false (alpha is a fixed mixing weight; with affine on it is absorbed by the norms).
# Targets: active_after (all users) and activate_passive (same label, supervised only on the ~11% of
# users with no RT/MT/RE activity before the cutoff; the graph-dependent variant).
exp_name: higgs_check
out_dir: ./runs
seed: 0
data:
  name: higgs-follow
  root: ./data
  pe_dim: 16
  target: ""
  subgraph_size: 500
  sampler: partition
  halo_hops: 0
  val_frac: 0.15
  test_frac: 0.15
  split_seed: 0
model:
  arch: hybrid
  attn: softmax
  performer_features: 64
  local: gcn
  branch_affine: false
  attn_radius: -1
  alpha: 0.5
  hidden: 64
  layers: 4
  heads: 4
  dropout: 0.1
  attn_dropout: 0.1
train:
  epochs: 100
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_epochs: 5
  grad_clip: 1.0
  patience: 20
  checkpoint_every: 5
measure:
  n_graphs_jacobian: 20
  targets_per_graph: 8
  pairs_per_graph: 32
  n_graphs_entropy: 20
  entropy_queries: 64
  n_graphs_range: 0
